services:
  postgres:
    image: postgres:16
    container_name: film_catalog_postgres
    environment:
      POSTGRES_DB: film_catalog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - film_catalog_postgres_data:/var/lib/postgresql/data

volumes:
  film_catalog_postgres_data:
